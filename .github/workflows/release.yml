name: Release

# Merges fire ONE release run, from the merged pull request.
#
# There was previously also a `push: branches: [main]` trigger. A merge fires
# both at once, they race to push the same tag, and the loser fails with
# "tag already exists" -- so every merge left a red run behind. The existing-tag
# guard below cannot prevent it: both runs check before either pushes.
#
# Losing the race also lost the release notes. Notes come from the pull request
# body, which only the pull_request run has, so whenever the push run won, the
# release fell back to generated notes. 1.4.0 and 1.5.0 were published that way.
#
# Direct pushes to main therefore no longer release. That is intended: main
# takes pull requests only (see AGENTS.md). Use the manual Run workflow button
# if a release is ever needed without one.
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: release
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target commit
        id: target
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SHA="${{ github.event.pull_request.merge_commit_sha }}"
          else
            SHA="${{ github.sha }}"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Release target: $SHA"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.target.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Read parserVersion
        id: ver
        run: |
          VERSION=$(node .github/scripts/extract-parser-version.js gmail-transaction-alerts-Code.gs)
          TAG="${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "parserVersion=$VERSION tag=$TAG"

      - name: Check whether tag already exists
        id: tag
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} already exists; skipping release."
          elif git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} already exists on origin; skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} is new."
          fi

      - name: Create tag and GitHub Release
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG (parserVersion $VERSION)"
          git push origin "$TAG"

          PREAMBLE=$(printf '%s\n' \
            "## Gmail Transaction Alerts $TAG" \
            "" \
            "Parser version: \`$VERSION\` (\`APP_CONFIG.parserVersion\`)." \
            "" \
            "Install by pasting [\`gmail-transaction-alerts-Code.gs\`](https://github.com/${{ github.repository }}/blob/${TAG}/gmail-transaction-alerts-Code.gs) into Apps Script \`Code.gs\`." \
            "" \
            "### Changes" \
            "")

          NOTES_FILE=$(mktemp)
          printf '%s\n' "$PREAMBLE" > "$NOTES_FILE"

          # Prefer the merged PR description; fall back to GitHub-generated notes.
          CHANGES=""
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "${PR_BODY//[[:space:]]/}" ]; then
            CHANGES="$PR_BODY"
            echo "Using PR #${PR_NUMBER} description for release notes."
          else
            # push / workflow_dispatch: find a PR that introduced this commit
            FOUND_PR=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/commits/${TARGET_SHA}/pulls" \
              --jq '.[0].number // empty' 2>/dev/null || true)
            if [ -n "$FOUND_PR" ]; then
              FOUND_BODY=$(gh api \
                -H "Accept: application/vnd.github+json" \
                "/repos/${{ github.repository }}/pulls/${FOUND_PR}" \
                --jq '.body // empty')
              if [ -n "${FOUND_BODY//[[:space:]]/}" ]; then
                CHANGES="$FOUND_BODY"
                echo "Using PR #${FOUND_PR} description for release notes."
              fi
            fi
          fi

          if [ -z "$CHANGES" ]; then
            echo "No PR description found; using GitHub-generated notes."
            CHANGES=$(gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="$TAG" \
              -f target_commitish="$TARGET_SHA" \
              --jq .body)
          fi

          printf '%s\n' "$CHANGES" >> "$NOTES_FILE"

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "$NOTES_FILE" \
            --target "$TARGET_SHA"
