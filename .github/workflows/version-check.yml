name: Version check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  version-check:
    name: version-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract PR parserVersion
        id: pr_version
        run: |
          GS=$(node .github/scripts/extract-parser-version.js gmail-transaction-alerts-Code.gs)
          echo "version=$GS" >> "$GITHUB_OUTPUT"
          echo "PR parserVersion: $GS"

      - name: Detect script file changes vs main
        id: changes
        run: |
          git fetch origin main --depth=1
          if git diff --name-only origin/main...HEAD | grep -E '^gmail-transaction-alerts-Code\.gs$' >/dev/null; then
            echo "script_changed=true" >> "$GITHUB_OUTPUT"
            echo "Script file changed in this PR."
          else
            echo "script_changed=false" >> "$GITHUB_OUTPUT"
            echo "No .gs changes; version bump not required."
          fi

      - name: Extract main parserVersion
        id: main_version
        run: |
          MAIN_GS=$(git show origin/main:gmail-transaction-alerts-Code.gs)
          MAIN_VER=$(printf '%s' "$MAIN_GS" | node -e "
            const fs = require('fs');
            const source = fs.readFileSync(0, 'utf8');
            const m = source.match(/parserVersion:\\s*['\"]([0-9]+\\.[0-9]+\\.[0-9]+)['\"]/);
            if (!m) { console.error('No parserVersion on main'); process.exit(1); }
            process.stdout.write(m[1]);
          ")
          echo "version=$MAIN_VER" >> "$GITHUB_OUTPUT"
          echo "main parserVersion: $MAIN_VER"

      - name: Advisory bump suggestion
        if: steps.changes.outputs.script_changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_VER: ${{ steps.pr_version.outputs.version }}
          MAIN_VER: ${{ steps.main_version.outputs.version }}
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD)
          SUGGESTION="patch"
          REASON="default for script changes that look like fixes"

          if echo "$CHANGED" | grep -E '^(fixtures/|tests/)' >/dev/null; then
            if echo "$CHANGED" | grep -E 'gmail-transaction-alerts-Code\.gs$' >/dev/null; then
              # New fixtures often mean new/changed parser coverage → minor
              if git diff origin/main...HEAD -- fixtures/ | grep -E '^\+' | grep -qiE 'debit|purchase|merchant|authorization'; then
                SUGGESTION="minor"
                REASON="fixtures/tests suggest new or expanded alert coverage"
              fi
            fi
          fi

          if git diff origin/main...HEAD -- gmail-transaction-alerts-Code.gs | grep -E '^\+.*function parse' >/dev/null; then
            SUGGESTION="minor"
            REASON="new parse* function(s) added"
          fi

          if git diff origin/main...HEAD -- gmail-transaction-alerts-Code.gs | grep -E "^\+.*TRANSACTION_HEADERS|^\-.*TRANSACTION_HEADERS|^\+.*'Imported At'|^\-.*'Parser Version'" >/dev/null; then
            SUGGESTION="major"
            REASON="sheet column/header contract may have changed"
          fi

          BODY=$(printf '%s\n' \
            "### Version bump advisory (non-blocking)" \
            "" \
            "- **main:** \`$MAIN_VER\`" \
            "- **this PR:** \`$PR_VER\`" \
            "- **suggested semver level:** \`$SUGGESTION\` ($REASON)" \
            "" \
            "Bump \`APP_CONFIG.parserVersion\` in \`gmail-transaction-alerts-Code.gs\`." \
            "This comment is advisory only; the required check is that the version differs from main when the script file changes." \
            "" \
            "<!-- version-bump-advisory -->")

          # Update or create a single sticky comment
          EXISTING=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.body | contains("<!-- version-bump-advisory -->")) | .id' | head -n1)
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${EXISTING}" \
              -f body="$BODY" >/dev/null
          else
            gh api -X POST "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              -f body="$BODY" >/dev/null
          fi

      - name: Require version bump when script changes
        if: steps.changes.outputs.script_changed == 'true'
        env:
          PR_VER: ${{ steps.pr_version.outputs.version }}
          MAIN_VER: ${{ steps.main_version.outputs.version }}
        run: |
          if [ "$PR_VER" = "$MAIN_VER" ]; then
            echo "::error::APP_CONFIG.parserVersion is still $MAIN_VER (same as main)."
            echo "This PR changes gmail-transaction-alerts-Code.gs, so you must bump parserVersion."
            echo "Bump guide: patch for bugfixes, minor for new parsers/behavior, major for breaking sheet contracts."
            exit 1
          fi
          echo "Version bumped: $MAIN_VER → $PR_VER"
