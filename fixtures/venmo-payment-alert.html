<!--
  Synthetic Venmo payment (you paid someone) alert.
  Structure and field labels mirror a real alert from venmo@venmo.com.
  All values are fictitious. Subject: You paid Alex Sample $12.34
-->
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<title>You paid Alex Sample $12.34</title>
</head>
<body>
<span class="preheader">You paid Alex Sample $12.34</span>
<table role="presentation" class="body p2p-table">
  <tr>
    <td>
      <img src="https://example.com/venmo-wordmark.png" alt="Venmo logo" />
      <div class="card-container">
        <div class="content-container">
          <p class="profile-image"><img src="https://example.com/profile.png" alt="Alex Sample image" /></p>
          <p class="text-center secondary-text title">You paid Alex Sample</p>
          <div class="amount-container">
            <div class="amount-container__centered">
              <div class="amount-container__text-high">$</div>
              <div class="amount-container__amount-text">12</div>
              <span style="display:none">.</span>
              <div class="amount-container__text-high">34</div>
            </div>
          </div>
          <p class="transaction-note secondary-text">Sample coffee run</p>
          <p class="text-center"><a class="venmo-button-v2" href="https://venmo.com/story/0000000000000000001">See transaction</a></p>
        </div>
      </div>
      <div class="transaction-detail">
        <h2 class="transaction-detail__title">Transaction details</h2>
        <h3>Date</h3>
        <p class="transaction-value">Jun 05, 2026</p>
        <h3>Status</h3>
        <p class="transaction-value">Completed</p>
        <h3>Transaction ID</h3>
        <p class="transaction-value">0000000000000000001</p>
        <h3>Payment Method</h3>
        <div class="transaction-value">SAMPLE BANK account ending in 4321</div>
        <h3>Sent from</h3>
        <p class="transaction-value">@sample_user</p>
      </div>
    </td>
  </tr>
</table>
</body>
</html>
